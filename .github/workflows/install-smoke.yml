name: install-smoke

# Runs the install scripts from this checkout, piped the way the README
# does, against the latest published release, checks that git runs the
# hook on a real commit on each OS, then runs the uninstall scripts.
on:
  pull_request:
    paths:
      - scripts/install.sh
      - scripts/install.ps1
      - scripts/uninstall.sh
      - scripts/uninstall.ps1
      - .github/scripts/install-smoke-hook.sh
      - .github/workflows/install-smoke.yml
  push:
    branches: [main]
    paths:
      - scripts/install.sh
      - scripts/install.ps1
      - scripts/uninstall.sh
      - scripts/uninstall.ps1
      - .github/scripts/install-smoke-hook.sh
      - .github/workflows/install-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-unix:
    name: install (${{ matrix.os }}, ${{ matrix.login_shell }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # new_shell is how a freshly opened terminal starts on that OS:
          # interactive non-login on Linux, interactive login on macOS.
          - os: ubuntu-latest
            login_shell: bash
            new_shell: bash -ic
          - os: macos-latest
            login_shell: zsh
            new_shell: zsh -lic
          - os: macos-latest
            login_shell: bash
            new_shell: bash -lic
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      SHELL: /bin/${{ matrix.login_shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version is resolved with an authenticated call: anonymous API
      # requests from shared runner IPs are rate limited, which would make
      # this flaky. The install dir is outside the runner's default PATH,
      # so the rc-file branch of the script runs.
      - name: Prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "GIT_COMMIT_SENTINEL_VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)" >> "$GITHUB_ENV"
          echo "GIT_COMMIT_SENTINEL_INSTALL_DIR=$RUNNER_TEMP/gcs-bin" >> "$GITHUB_ENV"

      - name: Install
        run: cat scripts/install.sh | sh

      - name: Install again (idempotent)
        run: cat scripts/install.sh | sh

      - name: PATH is added to exactly one rc file, once
        run: |
          count=0
          for f in .zshrc .bashrc .bash_profile .bash_login .profile .config/fish/config.fish; do
            if [ -f "$HOME/$f" ]; then
              n=$(grep -cF "$GIT_COMMIT_SENTINEL_INSTALL_DIR" "$HOME/$f" || true)
              echo "$f: $n"
              count=$((count + n))
            fi
          done
          test "$count" -eq 1

      - name: A new terminal finds the binary
        run: |
          out=$(${{ matrix.new_shell }} 'git-commit-sentinel version' 2>/dev/null | tail -n 1)
          echo "$out"
          test "$out" = "git-commit-sentinel ${GIT_COMMIT_SENTINEL_VERSION#v}"

      - name: Put the binary on PATH for the next step
        run: echo "$GIT_COMMIT_SENTINEL_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Hook rejects a bad commit and accepts a good one
        run: sh .github/scripts/install-smoke-hook.sh

      - name: Uninstall removes the hook, settings, binary and PATH line
        run: |
          git config --global commitsentinel.types feat,fix
          cat scripts/uninstall.sh | sh

          if [ -e "$GIT_COMMIT_SENTINEL_INSTALL_DIR" ]; then
            echo "error: $GIT_COMMIT_SENTINEL_INSTALL_DIR still exists" >&2
            exit 1
          fi
          for key in core.hooksPath commitsentinel.types; do
            if git config --global --get "$key"; then
              echo "error: global $key is still set" >&2
              exit 1
            fi
          done
          for f in .zshrc .bashrc .bash_profile .bash_login .profile .config/fish/config.fish; do
            if [ -f "$HOME/$f" ] && grep -F "$GIT_COMMIT_SENTINEL_INSTALL_DIR" "$HOME/$f"; then
              echo "error: $f still references the install dir" >&2
              exit 1
            fi
          done
          if ${{ matrix.new_shell }} 'command -v git-commit-sentinel'; then
            echo "error: a new terminal still finds git-commit-sentinel" >&2
            exit 1
          fi

          cd "$(mktemp -d)"
          git init -q
          git commit -q --allow-empty -m "fixed a bug"

      - name: Uninstall again (no-op)
        run: cat scripts/uninstall.sh | sh

  install-windows:
    name: install (windows-latest, ${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1, pwsh = PowerShell 7.
        shell: [powershell, pwsh]
    runs-on: windows-latest
    timeout-minutes: 10
    # A step's `shell` can't use the matrix; the job default can.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Bash avoids Windows PowerShell's Out-File encoding quirks on GITHUB_ENV.
      - name: Prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "GIT_COMMIT_SENTINEL_VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)" >> "$GITHUB_ENV"
          echo "GIT_COMMIT_SENTINEL_INSTALL_DIR=$RUNNER_TEMP\\gcs-bin" >> "$GITHUB_ENV"

      # A user PATH entry that references another variable, as e.g.
      # %JAVA_HOME%\bin does: the installer must leave it unexpanded.
      - name: Seed the user PATH with a %VAR% reference
        run: |
          [Environment]::SetEnvironmentVariable("GCS_SMOKE_HOME", "C:\gcs-smoke", "User")
          $key = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey("Environment")
          $raw = $key.GetValue("Path", "", [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $key.SetValue("Path", "%GCS_SMOKE_HOME%\bin;$raw", [Microsoft.Win32.RegistryValueKind]::ExpandString)
          $key.Close()

      # Actions prepends `$ErrorActionPreference = 'stop'` to every
      # PowerShell step, so reset it first or a leak would go unnoticed.
      - name: Install twice, leaving the session untouched
        run: |
          $ErrorActionPreference = "Continue"
          $ProgressPreference = "Continue"
          Get-Content -Raw scripts/install.ps1 | Invoke-Expression
          Get-Content -Raw scripts/install.ps1 | Invoke-Expression
          if ($ErrorActionPreference -ne "Continue") { throw "ErrorActionPreference leaked: $ErrorActionPreference" }
          if ($ProgressPreference -ne "Continue") { throw "ProgressPreference leaked: $ProgressPreference" }
          foreach ($name in "Version", "Tmp", "InstallDir") {
            if (Get-Variable -Name $name -ErrorAction SilentlyContinue) { throw "variable `$$name leaked into the session" }
          }
          if ($env:Path -notlike "*$env:GIT_COMMIT_SENTINEL_INSTALL_DIR*") { throw "session PATH was not updated" }
          $out = git-commit-sentinel version
          Write-Host $out
          if ($out -ne "git-commit-sentinel $($env:GIT_COMMIT_SENTINEL_VERSION.TrimStart('v'))") { throw "unexpected version: $out" }

      # Only 5.1 downloads through ServicePointManager.
      - name: Without TLS 1.2, install stops and its suggested fix works
        if: matrix.shell == 'powershell'
        run: |
          $ErrorActionPreference = "Continue"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls
          try {
            Get-Content -Raw scripts/install.ps1 | Invoke-Expression
            throw "install.ps1 succeeded with TLS 1.2 disabled"
          }
          catch {
            Write-Host $_.Exception.Message
            if ($_.Exception.Message -notlike "*TLS 1.2 or newer*is not enabled*") { throw }
          }
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Get-Content -Raw scripts/install.ps1 | Invoke-Expression

      - name: A release that doesn't exist fails with a clear message
        run: |
          $ErrorActionPreference = "Continue"
          $env:GIT_COMMIT_SENTINEL_VERSION = "v9.9.9"
          try {
            Get-Content -Raw scripts/install.ps1 | Invoke-Expression
            throw "install.ps1 succeeded for a release that doesn't exist"
          }
          catch {
            Write-Host $_.Exception.Message
            if ($_.Exception.Message -notlike "*could not download*from release v9.9.9 (does that release exist?)*") { throw }
          }

      - name: User PATH holds the install dir once and keeps %VAR% references
        run: |
          # Same dir with a trailing backslash: must still count as present.
          $env:GIT_COMMIT_SENTINEL_INSTALL_DIR += "\"
          Get-Content -Raw scripts/install.ps1 | Invoke-Expression
          $dir = $env:GIT_COMMIT_SENTINEL_INSTALL_DIR.TrimEnd("\")

          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Environment")
          $raw = $key.GetValue("Path", "", [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $kind = $key.GetValueKind("Path")
          $key.Close()
          Write-Host "user PATH ($kind): $raw"

          $count = @($raw -split ";" | Where-Object { $_.TrimEnd("\") -eq $dir }).Count
          if ($count -ne 1) { throw "expected the install dir once in the user PATH, found $count" }
          if ($raw -notlike "*%GCS_SMOKE_HOME%\bin*") { throw "the %GCS_SMOKE_HOME% reference was expanded" }
          if ($kind -ne "ExpandString") { throw "user PATH must stay REG_EXPAND_SZ, is $kind" }

      - name: Put the binary on PATH for the next step
        shell: bash
        run: echo "$GIT_COMMIT_SENTINEL_INSTALL_DIR" >> "$GITHUB_PATH"

      # Git for Windows runs the #!/bin/sh hook through its own sh, which
      # must resolve git-commit-sentinel to the .exe on PATH.
      - name: Hook rejects a bad commit and accepts a good one
        shell: bash
        run: sh .github/scripts/install-smoke-hook.sh

      - name: Uninstall removes the hook, settings, binary and PATH entry
        run: |
          $ErrorActionPreference = "Continue"
          git config --global commitsentinel.types feat,fix
          Get-Content -Raw scripts/uninstall.ps1 | Invoke-Expression
          if ($ErrorActionPreference -ne "Continue") { throw "ErrorActionPreference leaked: $ErrorActionPreference" }

          $dir = $env:GIT_COMMIT_SENTINEL_INSTALL_DIR
          if (Test-Path -LiteralPath $dir) { throw "$dir still exists" }
          foreach ($key in "core.hooksPath", "commitsentinel.types") {
            git config --global --get $key
            if ($LASTEXITCODE -eq 0) { throw "global $key is still set" }
          }

          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Environment")
          $raw = $key.GetValue("Path", "", [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $kind = $key.GetValueKind("Path")
          $key.Close()
          Write-Host "user PATH ($kind): $raw"
          if (@($raw -split ";" | Where-Object { $_.TrimEnd("\") -eq $dir }).Count -ne 0) { throw "the install dir is still in the user PATH" }
          if ($raw -notlike "*%GCS_SMOKE_HOME%\bin*") { throw "the %GCS_SMOKE_HOME% reference was lost or expanded" }
          if ($kind -ne "ExpandString") { throw "user PATH must stay REG_EXPAND_SZ, is $kind" }
          if (@($env:Path -split ";" | Where-Object { $_.TrimEnd("\") -eq $dir }).Count -ne 0) { throw "session PATH still holds the install dir" }

          $repo = Join-Path $env:RUNNER_TEMP "uninstalled-repo"
          git init -q $repo
          git -C $repo commit -q --allow-empty -m "fixed a bug"
          if ($LASTEXITCODE -ne 0) { throw "commit failed after uninstall" }

      - name: Uninstall again (no-op)
        run: Get-Content -Raw scripts/uninstall.ps1 | Invoke-Expression

  unsupported-macos-intel:
    name: install refuses (macos-15-intel)
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install fails with a clear message
        run: |
          if out=$(cat scripts/install.sh | sh 2>&1); then
            echo "error: install.sh succeeded on an Intel Mac" >&2
            exit 1
          fi
          echo "$out"
          case "$out" in
            *"Intel Macs are not supported"*) ;;
            *) exit 1 ;;
          esac

  unsupported-windows-arm:
    name: install refuses (windows-11-arm, ${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-11-arm
    timeout-minutes: 10
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install fails with a clear message
        run: |
          $ErrorActionPreference = "Continue"
          try {
            Get-Content -Raw scripts/install.ps1 | Invoke-Expression
            throw "install.ps1 succeeded on Windows on ARM"
          }
          catch {
            Write-Host $_.Exception.Message
            if ($_.Exception.Message -notlike "*Windows on ARM is not supported*") { throw }
          }
