rulesets:
  - name: Default Branch Protection
    target: branch
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        include: ["~DEFAULT_BRANCH"]
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: required_linear_history
      - type: pull_request
        parameters:
          # GitHub's ruleset API requires all five of these on a pull_request rule (rejects a partial object) —
          # the other four are no-ops in practice while required_approving_review_count is 0.
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: false
      # Carried over from the classic branch protection this ruleset replaces: the `test` job of ci.yml
      # must pass on an up-to-date branch. integration_id 15368 is GitHub Actions.
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: true
          required_status_checks:
            - context: test
              integration_id: 15368
